name: Build iOS Device IPA

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Keep device CI aligned with Kotlin 2.2.21's recommended Xcode line.
      - name: Select Xcode 26.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcode-select -p

      - name: List available Xcode versions
        run: ls -la /Applications | grep Xcode

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile', 'iosApp/Podfile.lock', 'shared/shared.podspec', 'shared/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate shared pod artifacts
        run: |
          for attempt in 1 2 3; do
            ./gradlew :shared:podspec :shared:generateDummyFramework && break
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle pod artifact generation failed after 3 attempts"
              exit 1
            fi
            echo "Gradle failed on attempt $attempt, retrying after 20s..."
            sleep 20
          done

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Verify CocoaPods integration
        run: |
          test -f iosApp/Podfile.lock
          grep -n "shared" iosApp/Podfile.lock
          test -d iosApp/Pods

      - name: Build Pods dependencies
        run: |
          cd iosApp
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme Pods-iosApp \
            -configuration ${{ github.event.inputs.build_configuration || 'Release' }} \
            -sdk iphoneos \
            -derivedDataPath build

      - name: Verify shared framework product
        run: |
          cd iosApp
          find build -name "shared.framework" -print || echo "Framework not found"

      - name: Build for Device
        run: |
          cd iosApp
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration ${{ github.event.inputs.build_configuration || 'Release' }} \
            -sdk iphoneos \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          cd iosApp
          xcodebuild \
            -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO || echo "Archive might not be created yet, trying alternative method"

      - name: Package IPA (Alternative)
        run: |
          cd iosApp
          BUILD_PATH="build/Build/Products/Release-iphoneos"
          if [ -d "$BUILD_PATH/iosApp.app" ]; then
            mkdir -p "$BUILD_PATH/Payload"
            cp -r "$BUILD_PATH/iosApp.app" "$BUILD_PATH/Payload/"
            cd "$BUILD_PATH"
            zip -r iosApp.ipa Payload
            ls -lh iosApp.ipa
          else
            echo "iosApp.app not found at $BUILD_PATH"
            find build -name "*.app" -type d
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa-${{ github.event.inputs.build_configuration || 'Release' }}
          path: |
            iosApp/build/Build/Products/Release-iphoneos/iosApp.ipa
            iosApp/build/ipa/

      - name: Build Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Configuration: ${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "Xcode Version:"
          xcode-select -v
          echo ""
          echo "Build artifacts:"
          find iosApp/build -name "*.ipa" -o -name "iosApp.app" 2>/dev/null | head -20
