name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iPhone (no signing)
        run: |
          xcodebuild \
          -scheme iosApp \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/iosApp.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

      - name: Extract .app
        run: |
          mkdir Payload
          cp -r build/iosApp.xcarchive/Products/Applications/*.app Payload/

      - name: Create IPA
        run: |
          cd Payload
          zip -r ../app.ipa .
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: app.ipa
