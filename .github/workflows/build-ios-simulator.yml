name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  # Prevent Gradle OOM on GitHub-hosted macOS runners (overriding local 12GB setting)
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Unsigned IPA for Device
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper & Disable Daemon Toolchain
        run: |
          chmod +x gradlew
          # Ensure Gradle uses the installed Java 17 directly and never attempts to download via foojay
          rm -f gradle/gradle-daemon-jvm.properties

      - name: Cache Kotlin/Native Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile', 'shared/shared.podspec', 'shared/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # Step 1: Generate initial podspec and dummy framework so pod install recognizes the shared pod
      - name: Generate Shared KMP Pod Artifacts
        run: |
          ./gradlew :shared:podspec :shared:generateDummyFramework --no-daemon

      # Step 2: Install CocoaPods to download GoogleMaps, Firebase and create iosApp.xcworkspace
      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      # Step 3: Build the real shared KMP arm64 framework for physical device (cinterop against downloaded Pods)
      - name: Build Real Shared KMP Framework for iPhone
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs="arm64" \
            -Pkotlin.native.cocoapods.configuration=${{ github.event.inputs.build_configuration || 'Release' }} \
            --no-daemon

      # Step 4: Build iOS app for physical device.
      # OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES tells CocoaPods script phase in Xcode to skip re-running Gradle,
      # avoiding environment/PATH/Java subshell failures.
      - name: Build iOS App for Device
        run: |
          cd iosApp
          export OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration ${{ github.event.inputs.build_configuration || 'Release' }} \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 5: Package into standard Sideloadly IPA format (Payload/iosApp.app at root)
      - name: Package IPA for Sideloadly
        run: |
          cd iosApp
          APP_PATH=$(find build/Build/Products -name "iosApp.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "Error: iosApp.app not found in build directory!"
            exit 1
          fi

          # Prepare Sideloadly-compatible Payload directory
          rm -rf Payload iosApp.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          # Package into .ipa preserving symlinks
          zip -r -y iosApp.ipa Payload
          
          echo "Successfully created IPA:"
          ls -lh iosApp.ipa

      # Step 6: Upload IPA artifact for download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-${{ github.event.inputs.build_configuration || 'Release' }}-sideloadly
          path: iosApp/iosApp.ipa
          retention-days: 7
