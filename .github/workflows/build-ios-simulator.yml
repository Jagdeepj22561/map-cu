name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Debug is 5x faster; Release has full optimization)'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Unsigned IPA for Device
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 & Cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper & Disable Daemon Toolchain
        run: |
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties

      # Cache Gradle local build cache (~/.gradle/caches/build-cache-1)
      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/transforms-4
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      # Cache Kotlin/Native Toolchain (~1.5GB download: clang, sysroot, lld, libffi)
      - name: Restore Kotlin/Native Toolchain
        id: restore-konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # Cache CocoaPods dependencies & download cache
      - name: Restore CocoaPods
        id: restore-pods
        uses: actions/cache/restore@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # Cache synthetic CocoaPods build (prevents rebuilding Firebase from C++ source every run)
      - name: Cache Synthetic Pods Build
        uses: actions/cache@v4
        with:
          path: |
            shared/build/cocoapods/synthetic/ios/build
            shared/build/cocoapods/synthetic/ios/Pods
          key: ${{ runner.os }}-synthetic-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-synthetic-pods-

      # Cache Xcode DerivedData Intermediates (speeds up xcodebuild)
      - name: Cache Xcode Intermediate Build Artifacts
        uses: actions/cache@v4
        with:
          path: iosApp/build/Build/Intermediates.noindex
          key: ${{ runner.os }}-xcode-intermediates-${{ github.event.inputs.build_configuration || 'Debug' }}-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-xcode-intermediates-${{ github.event.inputs.build_configuration || 'Debug' }}-

      # Step 1: Generate initial podspec and dummy framework so pod install recognizes the shared pod
      - name: Generate Shared KMP Pod Artifacts
        run: |
          ./gradlew :shared:podspec :shared:generateDummyFramework --build-cache

      # Step 2: Install CocoaPods to download Firebase and create iosApp.xcworkspace
      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install
          # Fix Xcode 16 Clang incompatibilities in gRPC / BoringSSL Pods
          chmod -R u+w Pods 2>/dev/null || true
          find Pods -name "basic_seq.h" -exec sed -i '' 's/CallSeqFactory(f_/CallSeqFactory<>(f_/g' {} + 2>/dev/null || true
          find Pods -name "*.pbxproj" -exec sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' {} + 2>/dev/null || true

      - name: Save CocoaPods Cache
        if: always() && steps.restore-pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.restore-pods.outputs.cache-primary-key || format('{0}-pods-{1}', runner.os, hashFiles('iosApp/Podfile')) }}

      # Step 3: Build the real shared KMP arm64 framework for physical device
      - name: Build Real Shared KMP Framework for iPhone
        run: |
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          chmod -R u+w shared/build 2>/dev/null || true
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs="arm64" \
            -Pkotlin.native.cocoapods.configuration=${{ github.event.inputs.build_configuration || 'Debug' }} \
            --build-cache

      - name: Save Kotlin/Native Toolchain
        if: always() && steps.restore-konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.restore-konan.outputs.cache-primary-key || format('{0}-konan-{1}', runner.os, hashFiles('gradle/libs.versions.toml')) }}

      # Step 4: Build iOS app for physical device.
      - name: Build iOS App for Device
        run: |
          cd iosApp
          if [ ! -f "GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist missing, creating default stub..."
            cat << 'EOF' > GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyB3B7v0OQEYfFsKIiytcvVT8SniI_xYz6g</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.example.iosApp</string>
            <key>PROJECT_ID</key>
            <string>cu-updates</string>
            <key>STORAGE_BUCKET</key>
            <string>cu-updates.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:abcdef1234567890</string>
          </dict>
          </plist>
          EOF
          fi
          export OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration ${{ github.event.inputs.build_configuration || 'Debug' }} \
            -sdk iphoneos \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.ncpu) \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 5: Package into standard Sideloadly IPA format (Payload/iosApp.app at root)
      - name: Package IPA for Sideloadly
        run: |
          cd iosApp
          APP_PATH=$(find build/Build/Products -name "iosApp.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "Error: iosApp.app not found in build directory!"
            exit 1
          fi

          # Prepare Sideloadly-compatible Payload directory
          rm -rf Payload iosApp.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          # Package into .ipa preserving symlinks
          zip -r -y iosApp.ipa Payload
          
          echo "Successfully created IPA:"
          ls -lh iosApp.ipa

      # Step 6: Upload IPA artifact for download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-${{ github.event.inputs.build_configuration || 'Debug' }}-sideloadly
          path: iosApp/iosApp.ipa
          retention-days: 7
